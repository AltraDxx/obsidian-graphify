name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Build and validate isolated wheel install
        run: |
          python -m build
          python scripts/check_wheel.py
      - name: Validate synthetic vault
        run: |
          graphify --vault tests/fixtures/sample-vault lint
          graphify --vault tests/fixtures/sample-vault status
          graphify --vault tests/fixtures/sample-vault export
          git diff --check
